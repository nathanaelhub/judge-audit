prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-2199
Title: A resolution accepting an in-kind grant from the Friends of Mill Ridge Park to the Metropolitan Government, acting by and through the Metropolitan Board of Parks and Recreation, to fund the purchase and installation of an Automated External Defibrillator (AED) at Mill Ridge Park.
Sponsors: Kyonzte Toombs, Terry Vo, Ginny Welsch, Brenda Gadd, Delishia Porterfield, Joy Styles
Text:
WHEREAS, the Friends of Mill Ridge Park have awarded an in-kind grant with an estimated value not to exceed $3,200 with no cash match required to the Metropolitan Government, acting by and through the Metropolitan Board of Parks and Recreation, to fund the purchase and installation of an Automated External Defibrillator (AED) at Mill Ridge Park; and,      
WHEREAS, it is to the benefit of the citizens of The Metropolitan Government of Nashville and Davidson County that this in-kind grant be accepted.
NOW, THEREFORE, BE IT RESOLVED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:
Section 1.	That the in-kind grant by and between the Friends of Mill Ridge Park, with an estimated value not to exceed $3,200 to the Metropolitan Government, acting by and through the Metropolitan Board of Parks and Recreation, to fund the purchase and installation of an Automated External Defibrillator (AED) at Mill Ridge Park, a copy of which is attached hereto and incorporated herein, is hereby approved.
Section 2.	That this in-kind grant be appropriated to the Metropolitan Nashville Parks and Recreation Department based on the revenues estimated to be received and any match to be applied.
Section 3.	That this resolution shall take effect from and after its adoption, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
..Agenda Analysis
Analysis

This resolution accepts an in-kind grant from the Friends of Mill Ridge Park to the Metropolitan Board of Parks and Recreation ("Metro Parks") to fund the purchase and installation of an Automated External Defibrillator (AED) at Mill Ridge Park.

The value of this in-kind grant is not to exceed $3,200, there is no cash match or obligation. Metro Parks accepted this grant at its July 7, 2026, meeting.
'''

