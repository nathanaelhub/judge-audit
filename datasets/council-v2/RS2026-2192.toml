prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-2192
Title: A resolution approving a contract between the Metropolitan Government, acting by and through the Metropolitan Board of Health, and the State of Tennessee, Department of Health, to provide Medical Examiner Investigations, Postmortem Examinations, and Consultations.
Sponsors: Kyonzte Toombs, Jordan Huffman
Text:
WHEREAS, Metropolitan Charter Section 10.104 provides that the Board of Health has the duty to contract for such services as will further the program and policies of the board, subject to confirmation by Resolution of Council; and, 
WHEREAS, the Metropolitan Government, acting by and through the Metropolitan Board of Health, wishes to contract with the State of Tennessee, Department of Health, to provide Medical Examiner Investigations, Postmortem Examinations, and Consultations; and,  
WHEREAS, it is to the benefit of the citizens of The Metropolitan Government of Nashville and Davidson County that this contract be approved.
NOW, THEREFORE, BE IT RESOLVED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:
Section 1.	That the contract by and between the State of Tennessee, Department of Health, and the Metropolitan Government, acting by and through the Metropolitan Board of Health, to provide Medical Examiner Investigations, Postmortem Examinations, and Consultations; a copy of which is attached hereto and incorporated herein, is hereby approved.   
 Section 2.	That this resolution shall take effect from and after its adoption, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
..Agenda Analysis

Analysis

This resolution approves a contract between the Metropolitan Board of Health and the Tennessee Department of Health. According to the agreement, the State will reimburse Metro for a portion of the expenses for each autopsy performed in Davidson County.

The term of the contract begins January 1, 2027, and extends for a period of 60 months. The state will provide a maximum of $640,266 for the services provided under the agreement.

The Metropolitan Council approved a similar agreement in 2022 pursuant to Resolution No. RS2022-1488.

Fiscal Note: This agreement will provide medical examiner investigations, postmortem examinations and consultations from the State of Tennessee, Department of Health in the amount of $640,266 from January 1, 2027, to December 31, 2031.
'''

