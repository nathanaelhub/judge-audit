prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-2187
Title: A resolution to appropriate grant funds from The Kresge Foundation to the Metropolitan Government, acting by and through the Metropolitan Action Commission, for general operating support.
Sponsors: Kyonzte Toombs, Jordan Huffman, Ginny Welsch, Brenda Gadd, Tasha Ellis, Zulfat Suara, Delishia Porterfield
Text:
WHEREAS, The Kresge Foundation has awarded a grant in an amount not to exceed $500,000.00 with no cash match required to the Metropolitan Government, acting by and through the Metropolitan Action Commission, for general operating support; and,  
WHEREAS, the Metropolitan Action Commission has accepted this grant pursuant to its authority under M.C.L. 2.108.050; and,
WHEREAS, it is to the benefit of the citizens of The Metropolitan Government of Nashville and Davidson County that these funds be appropriated to the Metropolitan Action Commission.
NOW, THEREFORE, BE IT RESOLVED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:
Section 1.	That the funds from a grant by and between The Kresge Foundation, in an amount not to exceed $500,000.00, to the Metropolitan Government, acting by and through the Metropolitan Action Commission, for general operating support, a copy of which grant is attached hereto and incorporated herein, be appropriated to the Metropolitan Action Commission.
Section 2.	That this resolution shall take effect from and after its adoption, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
..Agenda Analysis
Analysis

This resolution accepts a grant from The Kresge Foundation to the Metropolitan Action Commission ("MAC") for general operating support. According to Metropolitan Code of Laws section 2.108.050, MAC may accept grants in furtherance of its mission to meet the objectives of the Workforce Innovation and Opportunity Act of 2014 upon resolution of the Metropolitan Council.

The grant award is for $500,000 with no cash match required. The grant term begins on July 1, 2026, and ends June 30, 2028.
'''

