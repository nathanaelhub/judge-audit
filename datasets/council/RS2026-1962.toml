prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-1962
Title: A resolution authorizing the issuance of not to exceed two hundred eight million dollars ($208,000,000) in aggregate principal amount of interfund tax anticipation notes of The Metropolitan Government of Nashville and Davidson County.
Sponsors: Kyonzte Toombs
Text:
WHEREAS, under the provisions of the Local Government Public Obligations Act of 1986, Tennessee Code Annotated Sections 9-21-101, et seq., as may be amended, local governments in Tennessee are authorized through their respective governing bodies to issue and sell interfund tax anticipation notes of said governments for the purpose of meeting appropriations made in a fiscal year in anticipation of the collection of taxes and revenues; and,
WHEREAS, the Metropolitan County Council of The Metropolitan Government of Nashville and Davidson County has determined that it is necessary and advisable to issue two hundred eight million dollars ($208,000,000) in an aggregate principal amount of interfund tax anticipation notes in one or more series for the purpose of meeting appropriations made for Fiscal Year 2027 from its General Fund ("General Fund"), General Services District Debt Service Fund ("GSD Debt Fund"), Schools Debt Service Fund ("Schools Debt Fund"), and Urban Services District Debt Service Fund ("USD Debt Fund") (collectively the "Tax Funds"); and,
WHEREAS, it is the intention of the Metropolitan County Council to adopt this resolution for the purpose of authorizing $208,000,000 in an aggregate principal amount of said notes, providing for the issuance, sale and payment of said notes, establishing the terms thereof and the disposition of proceeds therefrom.
NOW, THEREFORE, BE IT RESOLVED BY THE METROPOLITAN COUNTY COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY AS FOLLOWS:
Section 1.  Authority.  The notes authorized by this resolution will be issued pursuant to the Local Government Public Obligations Act of 1986, Tennessee Code Annotated Sections 9-21-101, et seq., and other applicable provisions of law.
Section 2.  Definitions.  The following terms shall have the following meanings in this resolution unless the text expressly or by necessary implication requires otherwise:
(a)  "Code" means the Internal Revenue Code of 1986, as amended;
        (b) "Governing Body" means the Metropolitan County Council of the Metropolitan Government; 
	(c) "Lending Fund" means the fund of the Metropolitan Government designated as the following: Water & Sewerage Services Fund and General Fund Reserve. 
	(d) "Metropolitan Government" means The Metropolitan Government of Nashville and Davidson County (Tennessee); 

	(e) "Notes" means collectively the Interfund Tax Anticipation Notes, Series 2026-A, Series 2026-B, Series 2026-C, and Series 2026-D of the Metropolitan Government, authorized to be issued by this resolution; 
	(f)  "Registration Agent" means the Finance Director of the Metropolitan Government or such other person or entity as may be appointed by the Metropolitan Mayor to act as registration and paying agent for the Notes;	
	(g) "Series A Notes" means the not to exceed $75,000,000 Interfund Tax Anticipation Notes, Series 2026-A of the Metropolitan Government's General Fund, authorized to be issued by this resolution; 
	(h) "Series B Notes" means the not to exceed $100,000,000 Interfund Tax Anticipation Notes, Series 2026-B of the Metropolitan Government's GSD Debt Fund, authorized to be issued by this resolution; 
	(i) "Series C Notes" means the not to exceed $30,000,000 Interfund Tax Anticipation Notes, Series 2026-C of the Metropolitan Government's Schools Debt Fund, authorized to be issued by this resolution; and
	(j) "Series D Notes" means the not to exceed $3,000,000 Interfund Tax Anticipation Notes, Series 2026-D of the Metropolitan Government's USD Debt Fund, authorized to be issued by this resolution.  
Section 3.  Authorization and Terms of the Notes.  For the purpose of providing funds to meet appropriations in the Fiscal Year 2027 Metropolitan Government's Tax Funds and to pay costs incident to the issuance and sale of the Notes, if any, as more fully set forth herein, there are hereby authorized to be issued interfund tax anticipation notes of the Metropolitan Government, in one or more series, in the aggregate principal amount of not to exceed $208,000,000, subject to the approval of the Comptroller of the Treasury or Comptroller's designee. The Notes shall be issued without coupons, shall be designated as provided in Section 2(g)-(j), respectively, and shall be dated the date of their issuance.  The Notes shall bear interest at a rate or rates not to exceed the maximum rate permitted by applicable law, payable at maturity, which shall be not later June 30, 2027.  Subject to Section 7 hereof, the Notes may be prepaid at any time. In no event shall the principal amount of the Notes and any other tax anticipation notes payable from the Tax Funds exceed 60% of the appropriations to be made from the Tax Funds in the fiscal year in which the Notes are issued.
	The Notes shall be payable as to principal, premium, if any, and interest in lawful money of the United States of America at the offices of the Registration Agent.  The Registration Agent shall make all interest payments with respect to the Notes on each interest payment date directly to the owners of the Notes, and all such payments shall discharge the obligations of the Metropolitan Government in respect of such Notes to the extent of the payments so made.  Payment of principal of the Notes shall be made upon presentation and surrender of such Notes to the Registration Agent as the same shall become due and payable.

	The Notes shall be signed by the Metropolitan Mayor and attested to by the Metropolitan Clerk by their respective signatures.
	The Registration Agent is hereby authorized to authenticate and deliver the Notes in the name of the Lending Fund upon receipt by the Metropolitan Government of the proceeds of the sale thereof and to authenticate and deliver Notes in exchange for Notes of the same principal amount delivered for transfer upon receipt of the Note(s) to be transferred in proper form with proper documentation as hereinabove described.  The Notes shall not be valid for any purpose unless authenticated by the Registration Agent by the manual signature of an officer thereof on the certificate set forth herein on the Note form.
Section 4.  Source of Payment.  The Notes shall be payable from the receipt of taxes and revenues in the respective Tax Funds during the current fiscal year.  If the Metropolitan Government overestimates the amount of taxes and revenue collected for the fiscal year in which the Notes are issued and it becomes impossible to retire the Notes and all renewal notes prior to the close of such fiscal year, then the Metropolitan Government shall apply to the Comptroller of the Treasury within ten (10) days prior to the close of such fiscal year for permission to issue funding bonds to cover the unpaid Notes in the manner provided by Title 9, Chapter 11 of Tennessee Code Annotated or as otherwise provided for in a manner approved by the Comptroller of the Treasury or Comptroller's designee.
Section 5.  Form of Notes.  The Notes shall be in substantially the following form, the omissions to be appropriately completed when the Notes are prepared and delivered:

(Form of Face of Note)
					
