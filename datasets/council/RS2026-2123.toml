prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-2123
Title: A resolution approving an application for an Emergency Management Performance Grant (EMPG) from the Tennessee Emergency Management Agency, to the Metropolitan Government, acting by and through the Office of Emergency Management, to provide funds to subsidize the Emergency Management Program.
Sponsors: Kyonzte Toombs, Jordan Huffman, Brenda Gadd, David Benton, Terry Vo
Text:
WHEREAS, the Tennessee Emergency Management Agency, is accepting applications for an Emergency Management Performance Grant (EMPG) with an award of $180,049.50 and a required cash match of $180,049.50 to subsidize the Emergency Management Program; and, 
WHEREAS, the Metropolitan Government is eligible to participate in this grant program; and,
WHEREAS, IT is to the benefit of the citizens of The Metropolitan Government of Nashville and Davidson County that this grant application be approved and submitted.
NOW, THEREFORE BE IT RESOLVED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:
Section 1.	That the Metropolitan Government's application for an Emergency Management Performance Grant (EMPG) with an award of $180,049.50, a copy of which is attached hereto and incorporated herein, is hereby approved, and the Office of Emergency Management is authorized to submit said application to the Tennessee Emergency Management Agency.
Section 2.	That this resolution shall take effect from and after its adoption, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
..Agenda Analysis
Analysis

This resolution approves an application for an Emergency Management Performance Grant from the Tennessee Emergency Management Agency to the Office of Emergency Management ("OEM"). The grant would provide funds to subsidize the Emergency Management Program.

If awarded, the grant amount would be $180,049.50, with a required cash match of $180,049.50. The grant term is from October 1, 2025, to September 30, 2028.
'''

