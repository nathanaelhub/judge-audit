prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

BL2026-1475
Title: An ordinance to authorize building material restrictions and requirements for BL2026-1474, a proposed Specific Plan Zoning District for property located at 1205 2nd Avenue North, approximately 129 feet north of Madison Street (0.46 acres), to permit a mixed use development, all of which is described herein (Proposal No. 2026SP-024-001). THE PROPOSED ORDINANCE REQUIRES CERTAIN MATERIALS TO BE RESTRICTED IN THE CONSTRUCTION OF BUILDINGS.
Sponsors: Jacob Kupin
Text:
NOW, THEREFORE, BE IT ENACTED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:

Section 1. That the following building material restrictions and requirements as a part of BL2026-1474, a proposed Specific Plan Zoning District located at 1205 2nd Avenue North, approximately 129 feet north of Madison Street (0.46 acres), are hereby authorized:

* Building facades shall be constructed of brick, brick veneer, stone, cast stone, cementitious siding, and glass, or materials substantially similar in form and function, unless otherwise approved on detailed building elevations included with the preliminary SP.

Section 2. That this ordinance take effect immediately after its passage and such change be published in a newspaper of general circulation, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
'''

