prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

BL2026-1564
Title: An ordinance to amend Title 17 of the Metropolitan Code of Laws, the Zoning Ordinance of The Metropolitan Government of Nashville and Davidson County, by changing from IR to MUN-A-NS zoning on property located at 1326 3rd Avenue North, approximately 70 feet south of Taylor Street (0.16 acres), and within the Phillips Jackson Redevelopment District and Germantown Historic Preservation Overlay District, all of which is described herein (Proposal No. 2026Z-063PR-001).
Sponsors: Jacob Kupin
Text:
NOW, THEREFORE, BE IT ENACTED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:

Section 1.	That Title 17 of the Code of Laws of The Metropolitan Government of Nashville and Davidson County, is hereby amended by changing the Official Zoning Map for Metropolitan Nashville and Davidson County, which is made a part of Title 17 by reference, as follows:

By changing from IR to MUN-A-NS zoning on property located at 1326 3rd Avenue North, approximately 70 feet south of Taylor Street (0.16 acres), and within the Phillips Jackson Redevelopment District and Germantown Historic Preservation Overlay District, being Property Parcel No. 208 as designated on Map 082-09 of the Official Property Identification Maps of The Metropolitan Government of Nashville and Davidson County, all of which is described by lines, words and figures on the attached sketch, which is attached to and made a part of this ordinance as though copied herein.

Section 2.	Be it further enacted, that the Metropolitan Clerk is hereby authorized and directed, upon the enactment and approval of this ordinance, to cause the change to be made on Map 082-09 of said Official Zoning Map for Metropolitan Nashville and Davidson County, as set out in Section 1 of this ordinance, and to make notation thereon of reference to the date of passage and approval of this amendatory ordinance.

Section 3.	The Metropolitan Clerk is directed to publish a notice announcing such change in a newspaper of general circulation within five days following final passage.

Section 4.	This Ordinance shall take effect upon publication of above said notice announcing such change in a newspaper of general circulation, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
'''

