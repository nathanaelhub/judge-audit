prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-2224
Title: A resolution approving an application for a Hazard Mitigation Grant Program Grant from the Tennessee Emergency Management Agency to the Metropolitan Government, acting by and through the Office of the Mayor, to benefit all residents of Metro Nashville and Davidson County by ensuring uninterrupted access to safe, powered facilities when the electrical grid is compromised by providing funding for backup generators at the Fairgrounds Nashville to ensure continuity of operations during critical times.
Sponsors: Terry Vo, Jason Spain, Ginny Welsch, Brenda Gadd, Zulfat Suara, Burkley Allen, Tasha Ellis, David Benton
Text:
WHEREAS, the Tennessee Emergency Management Agency is accepting applications for a Hazard Mitigation Grant Program grant with an award of $1,458,056.25 and a required match of $486,018.75; and, 
WHEREAS, the Metropolitan Government is eligible to participate in this grant program; and,  
WHEREAS, it is to the benefit of the citizens of The Metropolitan Government of Nashville and Davidson County that the grant application be approved and submitted.
NOW, THEREFORE BE IT RESOLVED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:
Section 1.	That the application for a Hazard Mitigation Grant Program grant with an award of $1,458,056.25, a copy of which is attached hereto and incorporated herein, is hereby approved, and the Office of the Mayor is authorized to submit said application to the Tennessee Emergency Management Agency. 
Section 2.	That this resolution shall take effect from and after its adoption, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
..Agenda Analysis
Analysis

This resolution approves an application for a grant from the Tennessee Emergency Management Agency to the Nashville Fairgrounds. The grant would provide Building Resilient Infrastructure and Communities funds to purchase generators for emergency sheltering. If awarded, these generators would ensure uninterrupted access to safe, powered facilities when the electrical grid is compromised.

If awarded, the grant amount would be $1,458,056.25 with a required cash match of $486,018.75.
'''

