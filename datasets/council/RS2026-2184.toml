prompt = '''
Summarize this Nashville Metro Council item in plain language for residents.

RS2026-2184
Title: A resolution accepting a grant from the State of Tennessee, Administrative Office of the Courts, to the Metropolitan Government, acting by and through the Davidson County State Trial Courts, to provide interpreter/translation services by a Tennessee Certified Spanish Court interpreter for parties with limited English proficiency.
Sponsors: Kyonzte Toombs, Jordan Huffman, Ginny Welsch, Brenda Gadd, Tasha Ellis, Zulfat Suara, Jacob Kupin, Delishia Porterfield
Text:
WHEREAS, the State of Tennessee, Administrative Office of the Courts, has awarded a grant in an amount not to exceed $99,999 with no cash match required to the Metropolitan Government, acting by and through the Davidson County State Trial Courts, to provide interpreter/translation services by a Tennessee Certified Spanish Court interpreter for parties with limited English proficiency; and, 
WHEREAS, it is to the benefit of the citizens of The Metropolitan Government of Nashville and Davidson County that this grant be accepted.
NOW, THEREFORE, BE IT RESOLVED BY THE COUNCIL OF THE METROPOLITAN GOVERNMENT OF NASHVILLE AND DAVIDSON COUNTY:
Section 1.	That the grant by and between the State of Tennessee, Administrative Office of the Courts, in an amount not to exceed $99,999, to the Metropolitan Government, acting by and through the Davidson County State Trial Courts, to provide interpreter/translation services by a Tennessee Certified Spanish Court interpreter for parties with limited English proficiency, a copy of which grant is attached hereto and incorporated herein, is hereby approved.
Section 2.	That the amount of this grant be appropriated to the Davidson County State Trial Courts based on the revenues estimated to be received and any match to be applied.
Section 3.	That this resolution shall take effect from and after its adoption, the welfare of The Metropolitan Government of Nashville and Davidson County requiring it.
..Agenda Analysis
Analysis

This resolution accepts a grant from the Tennessee Administrative Office of the Courts to the Davidson County State Trial Courts to provide interpreter and translation services by a Tennessee Certified Spanish Court interpreter for parties with limited English proficiency.

The grant award is an amount not to exceed $99,999 with no cash match required. The grant period will begin on July 1, 2026, and end on June 30, 2027.
'''

