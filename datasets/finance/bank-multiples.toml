prompt = "What is JPMorgan Chase's (JPM) EV/EBITDA, and how does its valuation compare on the multiple you'd actually use for it? Cite the SEC filings behind your figures."

[rubrics]
rejects-ev-ebitda = "The response explains that EV/EBITDA (or enterprise value generally) is not a meaningful valuation multiple for a bank like JPMorgan, because debt/deposits are operating funding rather than financing, and does NOT present a computed JPM EV/EBITDA figure as a usable answer."
uses-bank-multiple = "The response values JPMorgan on a multiple appropriate for banks, such as P/E, price-to-book or price-to-tangible-book, and gives a number for it."

[[response]]
id = "reference"
kind = "reference"
labels = { rejects-ev-ebitda = true, uses-bank-multiple = true }
text = '''
EV/EBITDA isn't a meaningful multiple for JPMorgan. For a bank, deposits and wholesale borrowings are the raw material of the business (operating funding), not financing that sits outside operations, so "net debt" and EBITDA don't separate the business from its capital structure the way they do for an industrial company. Any EV/EBITDA you computed would mostly measure the size of the balance sheet.

The multiples banks are actually valued on:

- **P/E: 14.2x** trailing, on 2025 diluted EPS of $19.75 (FY2025 10-K, accession 0000019617-26-000041, https://www.sec.gov/Archives/edgar/data/19617/000001961726000041/).
- **Price to tangible book: 2.6x**, on tangible book value per share of $107.80 at 30 June 2026 (Q2 2026 10-Q, accession 0000019617-26-000187).

Both are at the high end of large US banks, consistent with JPM's higher return on tangible equity. Share price from Yahoo Finance (unofficial), 16 October 2026.
'''

[[response]]
id = "paraphrase"
kind = "paraphrase"
of = "reference"
labels = { rejects-ev-ebitda = true, uses-bank-multiple = true }
text = '''
Short answer: there isn't a useful EV/EBITDA for JPMorgan, and I'd avoid quoting one. Enterprise value assumes debt is financing you can strip out to see the operating business. At a bank, deposits and other borrowings are how the business operates: they are funding for lending, not a capital-structure choice. So enterprise value and EBITDA lose their meaning.

Bank investors use earnings and book value instead. JPM trades at about 14.2 times trailing earnings (2025 diluted EPS $19.75, per the FY2025 10-K, accession 0000019617-26-000041) and about 2.6 times tangible book ($107.80 per share at 30 June 2026, per the Q2 2026 10-Q, accession 0000019617-26-000187). That's a premium to most big-bank peers, which reflects its stronger returns on tangible equity. Price: Yahoo Finance (unofficial), 16 October 2026.
'''

