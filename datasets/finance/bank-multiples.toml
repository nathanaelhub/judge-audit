Why EV/EBITDA is n/m: deposits and wholesale funding are a bank's operating funding, not financing, so enterprise value and EBITDA don't isolate the operating business. Value JPM on P/E and P/TBV, where it screens at a premium to large-bank peers. Price from Yahoo Finance (unofficial), 16 Oct 2026.
'''

