text = '''
JPMorgan Chase is the largest US bank by assets, with four reportable segments: Consumer & Community Banking, the Commercial & Investment Bank, Asset & Wealth Management, and Corporate. Its revenue mixes net interest income, which depends on the rate environment and deposit costs, with fee income from investment banking, markets, card and asset management. Credit costs, capital requirements under the Basel framework, and the stress capital buffer all shape how much of its earnings it can return to shareholders through dividends and buybacks.

EV/EBITDA isn't a meaningful multiple for JPMorgan. For a bank, deposits and wholesale borrowings are the raw material of the business (operating funding), not financing that sits outside operations, so "net debt" and EBITDA don't separate the business from its capital structure the way they do for an industrial company.

The multiples banks are actually valued on:

- **P/E: 14.2x** trailing, on 2025 diluted EPS of $19.75 (FY2025 10-K, accession 0000019617-26-000041).
- **Price to tangible book: 2.6x**, on tangible book value per share of $107.80 at 30 June 2026 (Q2 2026 10-Q, accession 0000019617-26-000187).

Investors typically compare these against return on tangible common equity: a bank earning well above its cost of equity deserves a premium to book, which is what JPM's multiple reflects. Peers such as Bank of America, Wells Fargo and Citigroup trade at lower P/TBV, in part because of lower returns. Share price from Yahoo Finance (unofficial), 16 October 2026.
'''

