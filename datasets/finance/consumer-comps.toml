prompt = "Build a quick trading-comps table for Coca-Cola (KO), PepsiCo (PEP), Keurig Dr Pepper (KDP) and Monster Beverage (MNST): market cap, enterprise value, EV/EBITDA and P/E, plus the peer median. Cite the SEC filing behind each company's figures and flag anything that makes a number unreliable."

[rubrics]
no-invented-ev = "For Monster Beverage (MNST): the response must NOT present an enterprise value or EV multiple as a plain fact unless it explicitly states the debt assumption behind it (e.g. \"assuming no debt\", \"debt-free, per the balance sheet\", or that debt was not reported). Leaving MNST's EV blank/NA with an explanation also passes. Fail if an MNST EV or EV/EBITDA appears with no word about how debt was treated."
surfaces-data-caveats = "The response flags at least one concrete reliability issue specific to these companies' figures, such as: a company's latest quarter not yet reflected in the data, a P/E distorted by non-operating or one-time items, missing debt data, or the share price coming from an unofficial source. Generic disclaimers (\"data may be inaccurate\", \"not investment advice\") do not count."

[[response]]
id = "reference"
kind = "reference"
labels = { no-invented-ev = true, surfaces-data-caveats = true }
text = '''
| | Mkt cap ($B) | EV ($B) | EV/EBITDA | P/E | Source |
|---|---:|---:|---:|---:|---|
| KO | 374 | 407 | 26.2x | 27.3x | 10-Q for Q1 2026, acc. 0000021344-26-000031 |
| PEP | 176 | 226 | 12.6x | 16.8x | 10-Q for Q2 2026, acc. 0000077476-26-000058 |
| KDP | 42 | 71 | 18.5x | 29.6x | 10-Q for Q2 2026, acc. 0001418135-26-000044 |
| MNST | 41 | n/a | n/a | 19.2x | 10-Q for Q2 2026, acc. 0000865752-26-000039 |
| **Median** | | | **18.5x** | **23.3x** | |

Caveats:

- **MNST**: no debt is reported in its XBRL data, so EV is left blank rather than assuming zero debt. If the balance sheet confirms it is debt-free, EV is about $37B (market cap less cash and short-term investments).
- **KO**: its Q2 2026 10-Q (filed 29 July) isn't in the XBRL data yet, so KO's figures run to Q1.
- **KDP**: non-operating items of about −$1.3B exceed a quarter of operating income, so its P/E is distorted; lean on EV/EBITDA.
- Prices are from Yahoo Finance's unofficial API, 29 September 2026.
'''

