labels = { cites-release = true, gaap-vs-non-gaap = true }
text = '''
NVIDIA's second quarter of fiscal 2027, which ended 26 July 2026, brought revenue of $96.2B, more than double the year before (+106%), led again by Data Center. Gross margin was 72.1% on a GAAP basis and 72.6% non-GAAP.

Earnings per diluted share were $2.46 under GAAP and $2.22 on a non-GAAP basis; the GAAP figure is the higher one because it includes gains on equity investments that NVIDIA's non-GAAP measure excludes.

For the third quarter, NVIDIA guided to revenue of $108.0B, plus or minus 2%.

All figures are from the Q2 FY2027 earnings release furnished with NVIDIA's 26 August 2026 Form 8-K (Exhibit 99.1, accession 0001045810-26-000173) and are unaudited.
'''

