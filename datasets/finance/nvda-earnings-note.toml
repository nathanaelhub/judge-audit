prompt = "Draft a short earnings note on NVIDIA's (NVDA) second quarter of fiscal 2027 for a research team: headline revenue and growth, margins, EPS, and next-quarter guidance. Keep GAAP and non-GAAP figures clearly separated, and cite the source."

[rubrics]
cites-release = "The note cites NVIDIA's Q2 fiscal 2027 earnings release (the press release / 8-K exhibit filed August 2026) with a link or accession number. Fail if it cites only news coverage or gives no specific source."
gaap-vs-non-gaap = "The note reports GAAP diluted EPS of $2.46 and non-GAAP diluted EPS of $2.22, each correctly labeled. Fail if they are swapped, if only one is given without saying which basis it is, or if any EPS figure is unlabeled."

[[response]]
id = "reference"
kind = "reference"
labels = { cites-release = true, gaap-vs-non-gaap = true }
text = '''
**NVIDIA Q2 FY2027 (quarter ended 26 July 2026)**

- **Revenue:** $96.2B, up 106% year over year; Data Center was the large majority.
- **Gross margin:** GAAP 72.1%; non-GAAP 72.6%.
- **EPS:** GAAP diluted **$2.46**; non-GAAP diluted **$2.22**. GAAP was above non-GAAP this quarter because of gains on equity investments, which the non-GAAP measure excludes.
- **Q3 FY2027 outlook:** revenue of $108.0B, plus or minus 2%.

Source: NVIDIA's Q2 FY2027 earnings release, Exhibit 99.1 to its Form 8-K filed 26 August 2026 (accession 0001045810-26-000173), https://www.sec.gov/Archives/edgar/data/1045810/000104581026000173/. Figures are unaudited.
'''

