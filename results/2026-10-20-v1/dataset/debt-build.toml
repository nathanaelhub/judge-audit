prompt = "What was Apple's total debt at the end of fiscal 2024? Break it into its components and cite the filing."

[rubrics]
components = "The response breaks Apple's fiscal 2024 total debt into components that add up to roughly $106.6 billion: commercial paper of about $10.0 billion, current term debt of about $10.9 billion and non-current term debt of about $85.8 billion (small rounding differences are fine). Fail if components are double counted or do not sum to the stated total."

[[response]]
id = "reference"
kind = "reference"
labels = { components = true }
text = '''
Apple's total debt at the end of fiscal 2024 (28 September 2024) was **$106.629 billion**:

| Component | $B |
|---|---:|
| Commercial paper | 9.967 |
| Term debt, current portion | 10.912 |
| Term debt, non-current | 85.750 |
| **Total debt** | **106.629** |

Source: Apple's FY2024 Form 10-K, balance sheet and Note 9 (Debt), accession 0000320193-24-000123, https://www.sec.gov/Archives/edgar/data/320193/000032019324000123/. Operating lease liabilities are excluded.
'''

